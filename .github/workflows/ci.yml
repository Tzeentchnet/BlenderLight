name: BlenderLight CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    name: Blender ${{ matrix.blender-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        blender-version: ["5.2.4"]
        os: [ubuntu-latest, windows-latest]
    env:
      BLENDER_CACHE: ${{ github.workspace }}/.blender
      BLENDER_MIRROR: https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2
      BLENDER_VERSION: ${{ matrix.blender-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lint
        run: |
          python -m pip install flake8
          python -m flake8 io_scene_lwo scripts/validate_blender52.py --count --show-source --statistics

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_CACHE }}
          key: ${{ runner.os }}-x64-blender-${{ matrix.blender-version }}

      - name: Download Blender on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $install = Join-Path $env:BLENDER_CACHE "blender-$env:BLENDER_VERSION-windows-x64"
          if (Test-Path (Join-Path $install "blender.exe")) {
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $env:BLENDER_CACHE | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "blender-$env:BLENDER_VERSION-windows-x64.zip"
          $url = "$env:BLENDER_MIRROR/blender-$env:BLENDER_VERSION-windows-x64.zip"
          curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:BLENDER_CACHE
          Remove-Item -LiteralPath $archive

      - name: Download Blender on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          install="${BLENDER_CACHE}/blender-${BLENDER_VERSION}-linux-x64"
          if [[ -x "${install}/blender" ]]; then
            exit 0
          fi
          mkdir -p "${BLENDER_CACHE}"
          archive="${RUNNER_TEMP}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          url="${BLENDER_MIRROR}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3 --output "${archive}" "${url}"
          tar -xf "${archive}" -C "${BLENDER_CACHE}"
          rm "${archive}"

      - name: Test Blender on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $blender = Join-Path $env:BLENDER_CACHE "blender-$env:BLENDER_VERSION-windows-x64\blender.exe"
          & $blender --background --factory-startup --python scripts\validate_blender52.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Test Blender on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          "${BLENDER_CACHE}/blender-${BLENDER_VERSION}-linux-x64/blender" \
            --background \
            --factory-startup \
            --python scripts/validate_blender52.py
          status=$?
          if [[ -f /tmp/blender.crash.txt ]]; then
            cat /tmp/blender.crash.txt
          fi
          exit "${status}"
