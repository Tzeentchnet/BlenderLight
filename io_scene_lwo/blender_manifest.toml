schema_version = "1.0.0"

id = "blenderlight"
version = "2.0.0"
name = "BlenderLight"
tagline = "Import LightWave LWOB, LWO2, and LWO3 objects"
maintainer = "BlenderLight contributors"
type = "add-on"
category = "Import-Export"
website = "https://github.com/Tzeentchnet/BlenderLight"
tags = ["Import-Export"]

blender_version_min = "5.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Import LWO files and referenced textures from disk"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
]
